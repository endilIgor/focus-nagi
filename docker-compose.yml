services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: focusnagi
      POSTGRES_USER: focusnagi
      POSTGRES_PASSWORD: focusnagi
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focusnagi -d focusnagi"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_DATABASE_URL: jdbc:postgresql://db:5432/focusnagi
      APP_DATABASE_USER: focusnagi
      APP_DATABASE_PASSWORD: focusnagi
      APP_OWNER_USERNAME: ${APP_OWNER_USERNAME:-owner}
      APP_OWNER_PASSWORD: ${APP_OWNER_PASSWORD:?Set APP_OWNER_PASSWORD in .env}
      APP_COOKIE_SECURE: "false"
      APP_TIME_ZONE: ${APP_TIME_ZONE:-UTC}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/actuator/health | grep -q UP",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  postgres-data:
