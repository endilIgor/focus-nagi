spring:
  application:
    name: focus-nagi
  datasource:
    url: ${APP_DATABASE_URL:jdbc:postgresql://localhost:5432/focusnagi}
    username: ${APP_DATABASE_USER:focusnagi}
    password: ${APP_DATABASE_PASSWORD:focusnagi}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB
  jackson:
    default-property-inclusion: non_null

server:
  port: ${APP_PORT:8080}
  servlet:
    session:
      timeout: ${APP_SESSION_TIMEOUT:12h}
      cookie:
        name: FOCUS_SESSION
        http-only: true
        secure: ${APP_COOKIE_SECURE:false}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  time-zone: ${APP_TIME_ZONE:UTC}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  owner:
    username: ${APP_OWNER_USERNAME:owner}
    password: ${APP_OWNER_PASSWORD:}
  login:
    max-failures: ${APP_LOGIN_MAX_FAILURES:5}
    lock-minutes: ${APP_LOGIN_LOCK_MINUTES:5}

springdoc:
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /swagger-ui
    operations-sorter: alpha
