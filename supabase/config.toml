# Supabase CLI configuration. Used by `supabase link` / `supabase db push` for the hosted project
# and by `supabase start` for an optional local stack. Hosted Auth settings must also be set in the
# dashboard (see README: "Configurar o Supabase").
project_id = "focus-nagi"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Single-owner app: nobody can create accounts through the public API.
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
enable_confirmations = false
secure_password_change = true
